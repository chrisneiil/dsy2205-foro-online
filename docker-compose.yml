services:
  users-service:
    build:
      context: ./users-service
    environment:
      SERVER_PORT: 8081
      DB_URL: ${DB_URL:?DB_URL must be configured in .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be configured in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured in .env}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m}
    volumes:
      - ./wallet:/app/wallet:ro
    ports:
      - "127.0.0.1:8081:8081"
    restart: unless-stopped

  forum-service:
    build:
      context: ./forum-service
    environment:
      SERVER_PORT: 8082
      DB_URL: ${DB_URL:?DB_URL must be configured in .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be configured in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured in .env}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m}
    volumes:
      - ./wallet:/app/wallet:ro
    ports:
      - "127.0.0.1:8082:8082"
    restart: unless-stopped

  moderation-service:
    build:
      context: ./moderation-service
    environment:
      SERVER_PORT: 8083
      DB_URL: ${DB_URL:?DB_URL must be configured in .env}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME must be configured in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be configured in .env}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured in .env}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--Xms64m -Xmx256m}
    volumes:
      - ./wallet:/app/wallet:ro
    ports:
      - "127.0.0.1:8083:8083"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - users-service
      - forum-service
      - moderation-service
    ports:
      - "80:80"
    restart: unless-stopped
