server:
  port: ${SERVER_PORT:8081}
spring:
  application:
    name: users-service
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${DB_USERNAME:FORUM_APP}
    password: ${DB_PASSWORD:change-me}
    driver-class-name: oracle.jdbc.OracleDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt-secret: ${JWT_SECRET:local-dev-secret-change-this-to-at-least-32-characters}
  jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
